name: civic_os
description: CivicOS - GovTech app prototype for Italian municipalities.
publish_to: "none"
version: 0.1.0
environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  google_fonts: ^8.0.2
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^19.4.2
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.0.2
  fl_chart: ^1.2.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  image_picker: ^1.0.7
  url_launcher: ^6.2.1
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "web/CivicOS.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "web/CivicOS.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/CivicOS.png
    - assets/CivicOS-Remove.png
